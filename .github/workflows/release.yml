name: release

# Cut a release by pushing a semver tag:
#   git tag v2.0.0 && git push origin v2.0.0
# This builds the `secure` binary on ubuntu-latest (glibc, matching the
# github-hosted runner the action runs on), bundles it with rules.json, and
# attaches the tarball + SHA256SUMS to the release. It then syncs the moving
# major tag (vN) to the same commit and mirrors the assets to that tag's
# release, so `uses: javimosch/machin-secure@vN` always resolves to the latest
# vN.x with a downloadable binary.
#
# The composite action (action.yml) downloads this tarball at runtime instead
# of rebuilding the compiler on every scan — the difference between a
# multi-minute cold start and a ~380 KB HTTP fetch.

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (e.g. v2.6.0)"
        required: true
        type: string

permissions:
  contents: write   # create releases, move the major tag
  packages: write   # push the image to ghcr.io (optional Docker path)

jobs:
  release:
    # Build on ubuntu-22.04 (glibc 2.35) — the oldest current GitHub-hosted
    # runner — so the binary's glibc requirement stays ≤ 2.35 and it runs on
    # both ubuntu-22.04 and ubuntu-24.04 runners (forward-compatible). Building
    # on ubuntu-latest (24.04, glibc 2.39) would emit GLIBC_2.38 symbols and
    # break users who pin runs-on: ubuntu-22.04.
    runs-on: ubuntu-22.04
    env:
      # When triggered by tag push, github.ref_name is the tag (e.g. v2.6.0).
      # When triggered by workflow_dispatch, inputs.tag is the tag.
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Install build deps (Go + C compiler)
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc
          # machin is a Go compiler that emits C; secure is built by `machin build`.
          # setup-go below provides Go; gcc is preinstalled on ubuntu-latest but
          # make it explicit in case the runner image changes.

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Build machin (pinned to MACHIN_REF)
        env:
          # Pin machin to an immutable commit SHA for reproducible action builds.
          # Currently v0.123.0 (565c25c) — the release that added the 3-value
          # stat/exec multi-assign this tool relies on. Bump when machin-secure
          # needs a newer machin feature.
          MACHIN_REF: 565c25c
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/machin-bin" "$RUNNER_TEMP/machin-src"
          # --strip-components=1 drops the top-level "<repo>-<ref>/" dir from
          # the archive, so the source lands directly in machin-src regardless
          # of whether GitHub names it with the short ref or the full SHA.
          curl -sSL "https://github.com/javimosch/machin/archive/${MACHIN_REF}.tar.gz" \
            | tar xz -C "$RUNNER_TEMP/machin-src" --strip-components=1
          cd "$RUNNER_TEMP/machin-src"
          go build -o "$RUNNER_TEMP/machin-bin/machin" .
          echo "$RUNNER_TEMP/machin-bin" >> "$GITHUB_PATH"

      - name: Build secure
        run: |
          set -euo pipefail
          export PATH="$RUNNER_TEMP/machin-bin:$PATH"
          machin --help | head -1   # sanity: machin is on PATH
          ./build.sh

      - name: Bundle binary + rules
        run: |
          set -euo pipefail
          TAG="${RELEASE_TAG}"
          mkdir -p dist/machin-secure
          cp secure dist/machin-secure/secure
          cp rules.json dist/machin-secure/rules.json
          # Versioned name (for the v2.0.0 release) + stable name (for the
          # moving v2 release, so the composite action can fetch it by a
          # predictable URL regardless of the latest patch version).
          ( cd dist && tar czf "machin-secure-${TAG}-linux-amd64.tar.gz" machin-secure )
          ( cd dist && cp "machin-secure-${TAG}-linux-amd64.tar.gz" machin-secure-linux-amd64.tar.gz )
          ( cd dist && sha256sum machin-secure-${TAG}-linux-amd64.tar.gz machin-secure-linux-amd64.tar.gz > SHA256SUMS.txt )
          # cli-update-spec §2: version.json — the content-hash version endpoint.
          # The version is sha256[:12] of the stable-named tarball (the artifact
          # `secure update` downloads). This file is uploaded to both the version
          # tag release and the moving major tag release, so
          # https://github.com/javimosch/machin-secure/releases/download/v2/version.json
          # always points at the latest version metadata.
          FULL_SHA=$(sha256sum dist/machin-secure-linux-amd64.tar.gz | cut -d' ' -f1)
          CONTENT_HASH="${FULL_SHA:0:12}"
          DOWNLOAD_URL="/javimosch/machin-secure/releases/download/v2/machin-secure-linux-amd64.tar.gz"
          printf '{"ok":true,"version":"%s","download":"%s","sha256":"%s"}\n' \
            "$CONTENT_HASH" "$DOWNLOAD_URL" "$FULL_SHA" > dist/version.json
          echo "version.json: $(cat dist/version.json)"
          ls -l dist/

      - name: Attach assets to the version release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${RELEASE_TAG}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/machin-secure-${TAG}-linux-amd64.tar.gz dist/SHA256SUMS.txt dist/version.json --clobber
          else
            gh release create "$TAG" dist/machin-secure-${TAG}-linux-amd64.tar.gz dist/SHA256SUMS.txt dist/version.json \
              --generate-notes --title "${TAG}"
          fi

      - name: Sync the moving major tag (vN) and mirror assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${RELEASE_TAG}"        # e.g. v2.0.0
          MAJOR="${TAG%%.*}"              # e.g. v2
          SHA="$(git rev-parse "$TAG^{commit}")"
          # Move the major tag to the same commit (force, since it's a moving ref).
          git tag -f "$MAJOR" "$SHA"
          git push -f origin "$MAJOR"
          # Mirror the stable-named asset to the major tag's release so
          # `uses: ...@vN` can fetch machin-secure-linux-amd64.tar.gz by URL.
          if gh release view "$MAJOR" >/dev/null 2>&1; then
            gh release upload "$MAJOR" dist/machin-secure-linux-amd64.tar.gz dist/SHA256SUMS.txt dist/version.json --clobber
            gh release edit "$MAJOR" --title "${MAJOR} (moving — latest ${TAG})"
          else
            gh release create "$MAJOR" dist/machin-secure-linux-amd64.tar.gz dist/SHA256SUMS.txt dist/version.json \
              --generate-notes --title "${MAJOR} (moving — latest ${TAG})"
          fi
          echo "Synced ${MAJOR} → ${SHA} (release ${TAG})"
