name: 'machin-secure'
author: 'javimosch'
description: 'KISS agent-first security auditor — runs machin-secure and produces a SARIF 2.1.0 report for GitHub Code Scanning'
branding:
  icon: 'shield'
  color: 'gray-dark'
inputs:
  target:
    description: 'Directory or file to scan (relative to the repo root)'
    required: false
    default: '.'
  rules:
    description: 'Path to rules.json (defaults to the rule pack bundled in the downloaded release)'
    required: false
    default: ''
  output:
    description: 'Path to write the SARIF file (relative to the repo root)'
    required: false
    default: 'machin-secure.sarif'
  args:
    description: 'Extra CLI flags passed to `secure` (e.g. "--diff-base origin/main" to scan only changed files, "--workers 4"). See `secure --help`.'
    required: false
    default: ''
outputs:
  sarif:
    description: 'Path to the generated SARIF file'
    value: ${{ inputs.output }}
runs:
  using: 'composite'
  steps:
    - name: Fetch the machin-secure binary
      id: fetch
      shell: bash
      env:
        ACTION_REPO: ${{ github.action_repository }}
        ACTION_REF: ${{ github.action_ref }}
      run: |
        set -euo pipefail
        : "${ACTION_REPO:?action_repository is required}"
        : "${ACTION_REF:?action_ref is required}"
        # The release workflow publishes a stable-named tarball to the
        # major-tag release (v2, v3, ...) so this URL is predictable
        # regardless of the latest patch version.
        URL="https://github.com/${ACTION_REPO}/releases/download/${ACTION_REF}/machin-secure-linux-amd64.tar.gz"
        TOOL_DIR="$RUNNER_TEMP/machin-secure"
        rm -rf "$TOOL_DIR"
        mkdir -p "$TOOL_DIR"
        echo "Fetching $URL"
        curl -fsSL "$URL" | tar xz -C "$TOOL_DIR"
        # The tarball extracts a `machin-secure/` dir containing `secure` + `rules.json`.
        if [ ! -x "$TOOL_DIR/machin-secure/secure" ]; then
          echo "::error::machin-secure binary not found in tarball (expected machin-secure/secure)"
          exit 1
        fi
        chmod +x "$TOOL_DIR/machin-secure/secure"
        echo "tool-dir=$TOOL_DIR/machin-secure" >> "$GITHUB_OUTPUT"

    - name: Run machin-secure
      shell: bash
      env:
        TOOL_DIR: ${{ steps.fetch.outputs.tool-dir }}
        TARGET: ${{ inputs.target }}
        RULES: ${{ inputs.rules }}
        OUTPUT: ${{ inputs.output }}
        EXTRA_ARGS: ${{ inputs.args }}
      run: |
        set +e
        RULES_PATH="${RULES:-$TOOL_DIR/rules.json}"
        # shellcheck disable=SC2086  # intentional word-splitting of EXTRA_ARGS
        "$TOOL_DIR/secure" --sarif --target "$TARGET" --rules "$RULES_PATH" $EXTRA_ARGS > "$OUTPUT"
        code=$?
        set -e
        if [ "$code" = "1" ]; then
          echo "::error::machin-secure failed (exit 1) — see SARIF output or run secure directly"
          cat "$OUTPUT"
          exit 1
        fi
        if [ "$code" = "2" ]; then
          echo "::warning::machin-secure found high/critical findings — SARIF written to $OUTPUT"
        else
          echo "::notice::machin-secure scan complete — SARIF written to $OUTPUT"
        fi
        exit 0
